<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#ffafd5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Mochi Merge" />
<title>Mochi Merge ♡ Kawaii Café</title>

<!-- PWA manifest inlined so the file is fully self-contained -->
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">

<style>
  /* ─────────────────────────────────────────
     PALETTE
     ───────────────────────────────────────── */
  :root {
    --cream:   #fff5e8;
    --peach:   #ffe4d0;
    --pink:    #ffd1e4;
    --pink2:   #ffb3d1;
    --hotpink: #ff6fa8;
    --lav:     #e4ceff;
    --lav2:    #c9a9f0;
    --mint:    #b8ecd2;
    --mint2:   #7ed3ab;
    --berry:   #4a2540;
    --berryd:  #2d1528;
    --empty:   #f3dbe9;
    --board:   #ecc9de;
    --shadow:  #b07a98;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    min-height: 100dvh;
    font-family: 'Fredoka', system-ui, sans-serif;
    color: var(--berry);
    background:
      radial-gradient(ellipse at 20% 0%, #fff 0%, transparent 45%),
      radial-gradient(ellipse at 80% 100%, #ffe0b8 0%, transparent 50%),
      linear-gradient(180deg, var(--cream) 0%, var(--peach) 40%, var(--pink) 100%);
    background-attachment: fixed;
    overflow-x: hidden;
    position: relative;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* Scanline CRT overlay for gentle retro vibe */
  body::before {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none;
    background-image: repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.04) 0px,
      rgba(255,255,255,0.04) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 100;
    mix-blend-mode: overlay;
  }

  /* Floating background sparkles */
  .floaties {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .floatie {
    position: absolute;
    bottom: -40px;
    left: var(--x);
    font-size: var(--sz, 1.2rem);
    opacity: 0;
    animation: floatUp 14s var(--delay, 0s) infinite linear;
    filter: drop-shadow(0 2px 2px rgba(255,143,191,.3));
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: .55; }
    90%  { opacity: .55; }
    100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
  }

  /* ─────────────────────────────────────────
     LAYOUT
     ───────────────────────────────────────── */
  .app {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 18px 16px 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 100dvh;
  }

  /* ─────────────────────────────────────────
     HEADER
     ───────────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .brand {
    font-family: 'Press Start 2P', monospace;
    font-size: 15px;
    line-height: 1.4;
    color: var(--hotpink);
    text-shadow:
      2px 2px 0 #fff,
      4px 4px 0 var(--lav2);
    letter-spacing: 0.5px;
  }
  .brand small {
    display: block;
    font-family: 'VT323', monospace;
    font-size: 16px;
    color: var(--berry);
    text-shadow: none;
    letter-spacing: 2px;
    margin-top: 6px;
  }

  .scores {
    display: flex;
    gap: 8px;
  }
  .score-pill {
    background: #fff;
    padding: 8px 12px;
    border-radius: 14px;
    border: 3px solid var(--berry);
    box-shadow: 3px 3px 0 var(--berry);
    text-align: center;
    min-width: 64px;
  }
  .score-pill .label {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--hotpink);
    letter-spacing: 0.5px;
  }
  .score-pill .value {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: var(--berry);
    margin-top: 4px;
    transition: transform .2s cubic-bezier(.5,1.8,.4,1);
  }
  .score-pill .value.bump { transform: scale(1.25); }

  /* ─────────────────────────────────────────
     SUBTITLE STRIP
     ───────────────────────────────────────── */
  .strip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border: 3px solid var(--berry);
    box-shadow: 3px 3px 0 var(--berry);
    border-radius: 14px;
    padding: 10px 14px;
    font-family: 'VT323', monospace;
    font-size: 20px;
    line-height: 1;
    color: var(--berry);
  }
  .strip .goal {
    display: flex; align-items: center; gap: 8px;
    font-weight: 700;
  }
  .strip .goal .chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    border-radius: 8px;
    font-size: 18px;
    background: var(--pink);
    border: 2px solid var(--berry);
    box-shadow: 2px 2px 0 var(--berry);
  }
  .strip button.icon {
    background: var(--mint);
    border: 2px solid var(--berry);
    box-shadow: 2px 2px 0 var(--berry);
    border-radius: 10px;
    width: 32px; height: 32px;
    font-size: 18px;
    cursor: pointer;
    transition: transform .1s, background-color .15s;
  }
  .strip button.icon:active { transform: translate(2px,2px); box-shadow: none; }
  .strip-btns { display: flex; gap: 8px; align-items: center; }
  .strip button.sound-btn[data-on="true"] {
    background: var(--hotpink);
    animation: soundPulse 1.2s ease-in-out infinite;
  }
  @keyframes soundPulse {
    0%,100% { box-shadow: 2px 2px 0 var(--berry), 0 0 0 0 rgba(255,111,168,.55); }
    50%     { box-shadow: 2px 2px 0 var(--berry), 0 0 0 6px rgba(255,111,168,0); }
  }
  .strip button.sound-btn.err {
    animation: soundShake .5s cubic-bezier(.36,.07,.19,.97);
    background: #ff4d6f !important;
  }
  @keyframes soundShake {
    10%,90% { transform: translateX(-2px); }
    20%,80% { transform: translateX(3px); }
    30%,50%,70% { transform: translateX(-4px); }
    40%,60% { transform: translateX(4px); }
  }

  /* ─────────────────────────────────────────
     BOARD
     ───────────────────────────────────────── */
  .board-wrap {
    position: relative;
    margin-top: 4px;
  }
  .board {
    --cols: 4;
    --pad: 12px;
    --gap: 10px;
    position: relative;
    aspect-ratio: 1 / 1;
    background: var(--board);
    border: 4px solid var(--berry);
    border-radius: 20px;
    padding: var(--pad);
    box-shadow:
      5px 5px 0 var(--berry),
      inset 0 0 0 2px rgba(255,255,255,.4);
    touch-action: none;
    overflow: hidden;
  }
  /* Decorative lace along top of board */
  .board::before {
    content: '';
    position: absolute;
    left: 8px; right: 8px; top: -8px;
    height: 12px;
    background:
      radial-gradient(circle at 8px 8px, var(--pink2) 4px, transparent 5px) 0 0 / 16px 16px repeat-x;
    opacity: .7;
    pointer-events: none;
  }

  .cells-grid {
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    gap: var(--gap);
    position: relative;
    z-index: 1;
  }
  .cell {
    aspect-ratio: 1 / 1;
    background: var(--empty);
    border-radius: 12px;
    border: 2px dashed rgba(255,255,255,.6);
    box-shadow: inset 2px 2px 0 rgba(255,255,255,.5),
                inset -2px -2px 0 rgba(138,74,107,.08);
  }

  .tiles-layer {
    position: absolute;
    inset: var(--pad);
    pointer-events: none;
    z-index: 2;
  }

  .tile {
    position: absolute;
    top: 0; left: 0;
    width: var(--cell-size, 25%);
    height: var(--cell-size, 25%);
    transform: translate(
      calc(var(--col, 0) * (var(--cell-size, 0px) + var(--gap))),
      calc(var(--row, 0) * (var(--cell-size, 0px) + var(--gap)))
    );
    transition: transform 140ms cubic-bezier(.3,.8,.4,1);
    will-change: transform;
    display: grid;
    place-items: center;
    border-radius: 14px;
    border: 3px solid var(--berry);
    box-shadow:
      0 3px 0 var(--berry),
      inset 2px 2px 0 rgba(255,255,255,.45),
      inset -2px -3px 0 rgba(0,0,0,.08);
    overflow: hidden;
  }
  .tile .inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    width: 100%; height: 100%;
    padding: 4px;
    line-height: 1;
  }
  .tile .emoji {
    font-size: clamp(24px, 7vw, 40px);
    filter: drop-shadow(0 2px 2px rgba(74,37,64,.25));
  }
  .tile .val {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(8px, 2.5vw, 12px);
    color: #fff;
    text-shadow: 1px 1px 0 rgba(74,37,64,.6);
    letter-spacing: 0.3px;
  }

  /* Spawn animation */
  .tile.new .inner {
    animation: spawn 220ms cubic-bezier(.4,1.6,.5,1);
  }
  @keyframes spawn {
    0%   { transform: scale(0); opacity: 0; }
    60%  { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); }
  }

  /* Merge pop */
  .tile.pop .inner {
    animation: pop 240ms cubic-bezier(.4,1.8,.4,1);
  }
  @keyframes pop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.22) rotate(-3deg); }
    70%  { transform: scale(.92) rotate(2deg); }
    100% { transform: scale(1) rotate(0); }
  }

  /* Sparkle on merge */
  .spark {
    position: absolute;
    pointer-events: none;
    font-size: 18px;
    animation: sparkle 500ms ease-out forwards;
    z-index: 3;
  }
  @keyframes sparkle {
    0%   { transform: translate(var(--sx,0), var(--sy,0)) scale(0) rotate(0deg); opacity: 1; }
    60%  { transform: translate(var(--sx,0), var(--sy,0)) scale(1.2) rotate(180deg); opacity: 1; }
    100% { transform: translate(calc(var(--sx,0) * 2), calc(var(--sy,0) * 2 - 20px)) scale(0) rotate(360deg); opacity: 0; }
  }

  /* ─────────────────────────────────────────
     TIER COLORS
     ───────────────────────────────────────── */
  .tier-1  { background: linear-gradient(160deg, #fff7f0, #ffe8d6); }
  .tier-1 .val  { color: var(--berry); text-shadow: 1px 1px 0 #fff; }
  .tier-2  { background: linear-gradient(160deg, #ffe0ed, #ffc2dc); }
  .tier-2 .val  { color: var(--berry); text-shadow: 1px 1px 0 #fff; }
  .tier-3  { background: linear-gradient(160deg, #ffb9d3, #ff93b9); }
  .tier-4  { background: linear-gradient(160deg, #ff8fbf, #ff6499); }
  .tier-5  { background: linear-gradient(160deg, #e89dde, #c872c0); }
  .tier-6  { background: linear-gradient(160deg, #c9a6ec, #9a78d4); }
  .tier-7  { background: linear-gradient(160deg, #afe5c6, #70c79a); }
  .tier-7 .val { color: var(--berry); text-shadow: 1px 1px 0 rgba(255,255,255,.6); }
  .tier-8  { background: linear-gradient(160deg, #dbb48a, #a87a4d); }
  .tier-9  { background: linear-gradient(160deg, #ffd88a, #ffa84a); }
  .tier-9 .val { color: var(--berryd); text-shadow: 1px 1px 0 rgba(255,255,255,.5); }
  .tier-10 { background: linear-gradient(135deg, #ffb0d8 0%, #ffd3a0 50%, #b8d4ff 100%); }
  .tier-11 {
    background:
      conic-gradient(from 0deg,
        #ffafd5, #ffd3a0, #ffe89b, #b5ebc5,
        #a8d4ff, #d4b8ff, #ffafd5);
    animation: rainbow 3s linear infinite;
  }
  @keyframes rainbow {
    to { filter: hue-rotate(360deg); }
  }
  .tier-11 .inner {
    animation: legendaryPulse 1.4s ease-in-out infinite;
  }
  @keyframes legendaryPulse {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.05); }
  }

  /* ─────────────────────────────────────────
     FOOTER ACTIONS
     ───────────────────────────────────────── */
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }
  .btn {
    flex: 1;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    padding: 14px 10px;
    border-radius: 14px;
    border: 3px solid var(--berry);
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
    letter-spacing: 0.5px;
    color: var(--berry);
  }
  .btn.primary {
    background: var(--hotpink);
    color: #fff;
    text-shadow: 1px 1px 0 var(--berry);
    box-shadow: 4px 4px 0 var(--berry);
  }
  .btn.ghost {
    background: #fff;
    box-shadow: 4px 4px 0 var(--berry);
  }
  .btn:active {
    transform: translate(4px,4px);
    box-shadow: 0 0 0 var(--berry);
  }

  /* ─────────────────────────────────────────
     LEGEND
     ───────────────────────────────────────── */
  .legend {
    background: #fff;
    border: 3px solid var(--berry);
    border-radius: 14px;
    box-shadow: 3px 3px 0 var(--berry);
    padding: 12px 14px;
  }
  .legend-head {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--hotpink);
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }
  .legend-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(68px, 1fr));
    gap: 8px;
  }
  .legend-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-family: 'VT323', monospace;
    font-size: 14px;
    color: var(--berry);
    text-align: center;
    line-height: 1;
  }
  .legend-chip {
    width: 38px; height: 38px;
    display: grid; place-items: center;
    border-radius: 10px;
    border: 2px solid var(--berry);
    box-shadow: 2px 2px 0 var(--berry);
    font-size: 22px;
  }
  .legend-item .num {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--hotpink);
  }

  /* ─────────────────────────────────────────
     MODAL / OVERLAY
     ───────────────────────────────────────── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(74,37,64,.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .overlay.on { display: flex; animation: fadeIn .2s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .card {
    background: #fff;
    border: 4px solid var(--berry);
    border-radius: 20px;
    box-shadow: 6px 6px 0 var(--berry);
    padding: 24px 22px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    position: relative;
    animation: popUp .35s cubic-bezier(.3,1.6,.5,1);
  }
  @keyframes popUp {
    0%   { transform: scale(.6) translateY(20px); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .card .big-emoji {
    font-size: 56px;
    display: block;
    margin-bottom: 8px;
    animation: wobble 2s ease-in-out infinite;
  }
  @keyframes wobble {
    0%,100% { transform: rotate(-6deg); }
    50%     { transform: rotate(6deg); }
  }
  .card h2 {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: var(--hotpink);
    margin-bottom: 10px;
    text-shadow: 2px 2px 0 #fff, 3px 3px 0 var(--lav2);
    letter-spacing: 0.5px;
  }
  .card p {
    font-family: 'VT323', monospace;
    font-size: 19px;
    line-height: 1.35;
    color: var(--berry);
    margin-bottom: 16px;
  }
  .card p + p { margin-top: -8px; }
  .card .card-actions {
    display: flex; flex-direction: column; gap: 10px;
  }
  .hint-list {
    text-align: left;
    font-family: 'VT323', monospace;
    font-size: 19px;
    line-height: 1.4;
    background: var(--pink);
    border: 2px solid var(--berry);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 14px;
  }
  .hint-list li { list-style: none; margin: 4px 0; padding-left: 22px; position: relative; }
  .hint-list li::before {
    content: '♡';
    position: absolute; left: 0; top: 0;
    color: var(--hotpink);
  }

  /* ─────────────────────────────────────────
     MASCOT PICKER + BUDDY ROW
     ───────────────────────────────────────── */
  .mascot-picker {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 6px;
  }
  .mascot-card {
    background: var(--pink);
    border: 3px solid var(--berry);
    border-radius: 16px;
    box-shadow: 3px 3px 0 var(--berry);
    padding: 10px 6px 12px;
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-family: inherit;
  }
  .mascot-card.lav { background: var(--lav); }
  .mascot-card:active {
    transform: translate(3px,3px);
    box-shadow: 0 0 0 var(--berry);
  }
  .mascot-card .m-svg {
    width: 100%;
    max-width: 130px;
  }
  .mascot-card .m-svg svg { width: 100%; height: auto; display: block; }
  .mascot-card .m-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--berry);
    letter-spacing: 0.5px;
  }
  .mascot-card .m-tag {
    font-family: 'VT323', monospace;
    font-size: 15px;
    color: var(--berry);
    opacity: 0.75;
    line-height: 1;
  }

  .buddy-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: var(--pink);
    border: 2px solid var(--berry);
    border-radius: 12px;
    margin-bottom: 12px;
  }
  .buddy-mini {
    width: 46px; height: 46px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--berry);
    box-shadow: 2px 2px 0 var(--berry);
    overflow: hidden;
    flex-shrink: 0;
    display: grid;
    place-items: center;
  }
  .buddy-mini svg { width: 100%; height: 100%; display: block; }
  .buddy-text {
    flex: 1;
    font-family: 'VT323', monospace;
    font-size: 17px;
    color: var(--berry);
    line-height: 1.1;
  }
  .buddy-text strong {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--hotpink);
    display: block;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  .buddy-row button.swap {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    padding: 8px 10px;
    border-radius: 10px;
    border: 2px solid var(--berry);
    box-shadow: 2px 2px 0 var(--berry);
    background: var(--mint);
    color: var(--berry);
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  .buddy-row button.swap:active {
    transform: translate(2px,2px);
    box-shadow: none;
  }

  .btn[disabled] {
    opacity: 0.4;
    cursor: not-allowed;
    filter: saturate(0.3);
  }
  .btn[disabled]:active { transform: none; box-shadow: 4px 4px 0 var(--berry); }

  /* Narrower pixel text for 3-button row */
  .actions .btn { font-size: 9px; padding: 14px 6px; letter-spacing: 0.2px; }

  /* ─────────────────────────────────────────
     HIGH-SCORE CELEBRATION
     ───────────────────────────────────────── */
  .celebration {
    position: fixed; inset: 0;
    z-index: 250;
    display: none;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
  }
  .celebration.on { display: flex; }
  .celebration .backdrop {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at center bottom, rgba(255,175,213,.85) 0%, rgba(200,114,192,.7) 40%, rgba(74,37,64,.55) 100%);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    animation: fadeIn .3s;
  }
  .celebration .stage {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px 24px;
    max-width: 420px;
    width: 100%;
  }
  .celebration .bubble {
    background: #fff;
    border: 3px solid var(--berry);
    border-radius: 20px;
    box-shadow: 4px 4px 0 var(--berry);
    padding: 14px 22px;
    margin-bottom: 10px;
    position: relative;
    animation: bubblePop .45s cubic-bezier(.3,1.7,.4,1) both;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--hotpink);
    text-shadow: 2px 2px 0 var(--lav);
    text-align: center;
    letter-spacing: 0.5px;
    line-height: 1.5;
  }
  .celebration .bubble small {
    display: block;
    margin-top: 8px;
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: var(--berry);
    text-shadow: none;
    letter-spacing: 1px;
  }
  .celebration .bubble::after {
    content: '';
    position: absolute;
    bottom: -13px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 14px solid var(--berry);
  }
  .celebration .bubble::before {
    content: '';
    position: absolute;
    bottom: -9px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 11px solid #fff;
    z-index: 1;
  }
  @keyframes bubblePop {
    0%   { transform: translateY(30px) scale(.6); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  .celebration .mascot-big {
    width: 72%;
    max-width: 280px;
    animation: mascotBounce 1.3s cubic-bezier(.3,1.5,.4,1) .15s both, mascotIdle 1.8s ease-in-out 1.45s infinite;
    filter: drop-shadow(0 8px 0 rgba(74,37,64,.25));
  }
  .celebration .mascot-big svg { width: 100%; height: auto; display: block; }
  @keyframes mascotBounce {
    0%   { transform: translateY(120%); }
    55%  { transform: translateY(-10%); }
    80%  { transform: translateY(5%); }
    100% { transform: translateY(0); }
  }
  @keyframes mascotIdle {
    0%,100% { transform: translateY(0) rotate(-1.5deg); }
    50%     { transform: translateY(-8px) rotate(1.5deg); }
  }
  .celebration .close-hint {
    position: absolute;
    top: 24px; left: 50%;
    transform: translateX(-50%);
    font-family: 'VT323', monospace;
    font-size: 16px;
    color: #fff;
    text-shadow: 1px 1px 0 var(--berry);
    letter-spacing: 1px;
    opacity: .9;
    animation: fadeIn .6s 1.4s both;
    white-space: nowrap;
  }
  .confetti {
    position: absolute;
    top: -8%;
    font-size: 18px;
    animation: confettiFall linear forwards;
    z-index: 1;
    pointer-events: none;
    will-change: transform, opacity;
  }
  @keyframes confettiFall {
    0%   { transform: translate(0, 0) rotate(0); opacity: 1; }
    100% { transform: translate(var(--dx, 0), 115vh) rotate(var(--rot, 720deg)); opacity: 0.85; }
  }

  /* ─────────────────────────────────────────
     RESPONSIVE
     ───────────────────────────────────────── */
  @media (max-width: 360px) {
    .brand { font-size: 13px; }
    .score-pill { padding: 6px 9px; min-width: 56px; }
    .score-pill .value { font-size: 12px; }
  }
  @media (min-height: 780px) {
    .app { padding-top: 30px; }
  }
</style>
</head>

/* ── State ── */
let grid;           // 4x4 of tileId or null
let tiles;          // Map<id, {id, v, r, c, el}>
let nextId;
let score, best, won, continued, locked;
let history;             // array of pre-move snapshots for undo
let startingBest;        // best score at the start of this game
let celebratedThisGame;  // ensure we only celebrate once per game
let mascot;              // 'f' or 'm' or null
let isPickingMascot = false;

const storage = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

function init(firstBoot = false) {
  grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  tiles = new Map();
  nextId = 1;
  score = 0;
  won = false;
  continued = false;
  locked = false;
  history = [];
  celebratedThisGame = false;
  tilesLayer.innerHTML = '';
  best = parseInt(storage.get('mochi_best', '0'), 10) || 0;
  startingBest = best;
  bestEl.textContent = best;
  updateScore(false);
  addRandomTile();
  addRandomTile();
  layout();
  render();
  updateNextGoal();
  updateUndoBtn();
  updateBuddyRow();
  if (firstBoot) {
    if (!mascot) {
      setTimeout(showMascotPicker, 300);
    } else {
      if (!storage.get('mochi_seenIntro', null)) {
        storage.set('mochi_seenIntro', '1');
        setTimeout(showIntro, 300);
      }
    }
  }
}

function addRandomTile() {
  const empties = [];
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (grid[r][c] === null) empties.push([r, c]);
  if (!empties.length) return null;
  const [r, c] = empties[Math.floor(Math.random() * empties.length)];
  const v = Math.random() < SPAWN_4_CHANCE ? 4 : 2;
  const id = nextId++;
  const tile = { id, v, r, c, el: null, fresh: true };
  grid[r][c] = id;
  tiles.set(id, tile);
  return tile;
}

function ensureEl(tile) {
  if (tile.el) return tile.el;
  const el = document.createElement('div');
  el.className = 'tile ' + tierOf(tile.v).cls + (tile.fresh ? ' new' : '');
  el.dataset.id = tile.id;
  el.innerHTML = `
    <div class="inner">
      <span class="emoji">${tierOf(tile.v).emoji}</span>
      <span class="val">${tile.v}</span>
    </div>`;
  tilesLayer.appendChild(el);
  tile.el = el;
  if (tile.fresh) {
    setTimeout(() => { el.classList.remove('new'); tile.fresh = false; }, 240);
  }
  return el;
}

function render() {
  for (const tile of tiles.values()) {
    const el = ensureEl(tile);
    el.style.setProperty('--row', tile.r);
    el.style.setProperty('--col', tile.c);
  }
}

function updateTileVisual(tile) {
  if (!tile.el) return;
  tile.el.className = 'tile ' + tierOf(tile.v).cls;
  tile.el.querySelector('.emoji').textContent = tierOf(tile.v).emoji;
  tile.el.querySelector('.val').textContent = tile.v;
}

function layout() {
  const pad = parseFloat(getComputedStyle(boardEl).paddingLeft);
  const gap = parseFloat(getComputedStyle(boardEl).getPropertyValue('--gap')) || 10;
  const width = boardEl.clientWidth - pad * 2;
  const cellSize = (width - gap * (SIZE - 1)) / SIZE;
  boardEl.style.setProperty('--cell-size', cellSize + 'px');
  boardEl.style.setProperty('--gap', gap + 'px');
}
window.addEventListener('resize', () => { layout(); render(); });

/* ── Movement ── */
function traversals(dir) {
  const rows = [0, 1, 2, 3];
  const cols = [0, 1, 2, 3];
  if (dir === 'down')  rows.reverse();
  if (dir === 'right') cols.reverse();
  return { rows, cols };
}
function vector(dir) {
  return ({ up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] })[dir];
}

function findFarthest(r, c, dr, dc) {
  let nr = r, nc = c;
  while (true) {
    const tr = nr + dr, tc = nc + dc;
    if (tr < 0 || tr >= SIZE || tc < 0 || tc >= SIZE) break;
    if (grid[tr][tc] !== null) {
      return { far: [nr, nc], next: [tr, tc] };
    }
    nr = tr; nc = tc;
  }
  return { far: [nr, nc], next: null };
}

function move(dir) {
  if (locked) return;
  const snap = snapshot();
  const [dr, dc] = vector(dir);
  const { rows, cols } = traversals(dir);
  let moved = false;
  const mergedIds = new Set(); // ids that absorbed this turn (can't re-merge)
  const toAbsorb = []; // {absorbedId, absorberId}
  let gained = 0;
  let reachedGoal = false;

  for (const r of rows) {
    for (const c of cols) {
      const id = grid[r][c];
      if (id === null) continue;
      const tile = tiles.get(id);
      const { far, next } = findFarthest(r, c, dr, dc);

      if (next) {
        const nid = grid[next[0]][next[1]];
        const neighbor = tiles.get(nid);
        if (neighbor && neighbor.v === tile.v && !mergedIds.has(nid)) {
          // Merge: move current onto neighbor
          grid[r][c] = null;
          tile.r = next[0]; tile.c = next[1];
          toAbsorb.push({ absorbedId: id, absorberId: nid });
          mergedIds.add(nid);
          moved = true;
          continue;
        }
      }
      // Just slide
      if (far[0] !== r || far[1] !== c) {
        grid[r][c] = null;
        grid[far[0]][far[1]] = id;
        tile.r = far[0]; tile.c = far[1];
        moved = true;
      }
    }
  }

  if (!moved) return;

  history.push(snap);
  updateUndoBtn();

  locked = true;
  render();

  setTimeout(() => {
    // Apply merges
    for (const { absorbedId, absorberId } of toAbsorb) {
      const absorber = tiles.get(absorberId);
      const absorbed = tiles.get(absorbedId);
      absorber.v *= 2;
      gained += absorber.v;
      updateTileVisual(absorber);
      absorber.el.classList.remove('pop');
      // force reflow to restart animation
      void absorber.el.offsetWidth;
      absorber.el.classList.add('pop');
      spawnSparkles(absorber);
      // remove absorbed element
      absorbed.el?.remove();
      tiles.delete(absorbedId);
      if (absorber.v === 2048 && !won) { won = true; reachedGoal = true; }
    }
    score += gained;
    addRandomTile();
    render();
    updateScore(gained > 0);
    updateNextGoal();
    locked = false;

    setTimeout(() => {
      if (reachedGoal && !continued) {
        showWin();
      } else if (isGameOver()) {
        showGameOver();
      }
    }, 250);
  }, MOVE_MS);
}

function isGameOver() {
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (grid[r][c] === null) return false;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const v = tiles.get(grid[r][c]).v;
      if (c + 1 < SIZE && tiles.get(grid[r][c + 1]).v === v) return false;
      if (r + 1 < SIZE && tiles.get(grid[r + 1][c]).v === v) return false;
    }
  }
  return true;
}

function updateScore(animate) {
  scoreEl.textContent = score;
  if (animate) {
    scoreEl.classList.remove('bump');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('bump');
    setTimeout(() => scoreEl.classList.remove('bump'), 200);
  }
  if (score > best) {
    best = score;
    bestEl.textContent = best;
    storage.set('mochi_best', String(best));
  }
  // High score celebration — only when player actually beats their previous best,
  // and only fire once per game.
  if (!celebratedThisGame && startingBest > 0 && score > startingBest) {
    celebratedThisGame = true;
    showCelebration();
  }
}

function updateNextGoal() {
  // Find highest tile currently on board
  let max = 0;
  for (const t of tiles.values()) if (t.v > max) max = t.v;
  const idx = TIERS.findIndex(t => t.v === max);
  const next = TIERS[Math.min(idx + 1, TIERS.length - 1)];
  nextChipEl.textContent = next.emoji;
  nextChipEl.className = 'chip ' + next.cls;
  nextNameEl.textContent = next.name;
}

function spawnSparkles(tile) {
  const rect = tile.el.getBoundingClientRect();
  const parent = tilesLayer.getBoundingClientRect();
  const cx = rect.left - parent.left + rect.width / 2;
  const cy = rect.top - parent.top + rect.height / 2;
  const chars = ['✦','✨','♡','★'];
  for (let i = 0; i < 4; i++) {
    const s = document.createElement('span');
    s.className = 'spark';
    s.textContent = chars[i % chars.length];
    s.style.left = (cx - 9) + 'px';
    s.style.top  = (cy - 9) + 'px';
    const angle = (Math.PI * 2 / 4) * i + Math.random() * 0.6;
    const dist = 22 + Math.random() * 14;
    s.style.setProperty('--sx', Math.cos(angle) * dist + 'px');
    s.style.setProperty('--sy', Math.sin(angle) * dist + 'px');
    s.style.color = ['#ff6fa8','#c9a9f0','#7ed3ab','#ffb84a'][i];
    tilesLayer.appendChild(s);
    setTimeout(() => s.remove(), 550);
  }
}

/* ── Input: keyboard ── */
const keyMap = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  w: 'up', s: 'down', a: 'left', d: 'right',
  W: 'up', S: 'down', A: 'left', D: 'right',
};
window.addEventListener('keydown', (e) => {
  if (overlay.classList.contains('on')) return;
  const d = keyMap[e.key];
  if (d) { e.preventDefault(); move(d); }
});

/* ── Input: swipe ── */
let touchStart = null;
const SWIPE_THRESHOLD = 20;
boardEl.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  touchStart = { x: t.clientX, y: t.clientY };
}, { passive: true });
boardEl.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
boardEl.addEventListener('touchend', (e) => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  touchStart = null;
  if (Math.abs(dx) < SWIPE_THRESHOLD && Math.abs(dy) < SWIPE_THRESHOLD) return;
  if (Math.abs(dx) > Math.abs(dy)) {
    move(dx > 0 ? 'right' : 'left');
  } else {
    move(dy > 0 ? 'down' : 'up');
  }
});

/* Mouse drag fallback (for desktop testing) */
let mouseStart = null;
boardEl.addEventListener('mousedown', (e) => { mouseStart = { x: e.clientX, y: e.clientY }; });
boardEl.addEventListener('mouseup', (e) => {
  if (!mouseStart) return;
  const dx = e.clientX - mouseStart.x;
  const dy = e.clientY - mouseStart.y;
  mouseStart = null;
  if (Math.abs(dx) < SWIPE_THRESHOLD && Math.abs(dy) < SWIPE_THRESHOLD) return;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
  else move(dy > 0 ? 'down' : 'up');
});

/* ── Undo ── */
function snapshot() {
  return {
    grid: grid.map(r => r.slice()),
    tiles: Array.from(tiles.values()).map(t => ({ id: t.id, v: t.v, r: t.r, c: t.c })),
    score,
    nextId,
    won,
    continued,
  };
}
function restoreSnapshot(snap) {
  tilesLayer.innerHTML = '';
  tiles = new Map();
  grid = snap.grid.map(r => r.slice());
  score = snap.score;
  nextId = snap.nextId;
  won = snap.won;
  continued = snap.continued;
  for (const td of snap.tiles) {
    const tile = { id: td.id, v: td.v, r: td.r, c: td.c, el: null, fresh: false };
    tiles.set(td.id, tile);
    ensureEl(tile);
  }
  layout();
  render();
  // Restore score display WITHOUT re-triggering celebration
  scoreEl.textContent = score;
  updateNextGoal();
}
function undo() {
  if (locked || !history.length) return;
  const snap = history.pop();
  restoreSnapshot(snap);
  updateUndoBtn();
  // If a game-over / win modal is up, dismiss it (we rescued ourselves)
  if (overlay.classList.contains('on') && !isPickingMascot) closeModal();
}
function updateUndoBtn() {
  undoBtn.disabled = history.length === 0;
  undoBtn.textContent = history.length === 0
    ? '↶ UNDO'
    : `↶ UNDO (${history.length})`;
}

/* ── Mascot picker ── */
function showMascotPicker() {
  isPickingMascot = true;
  const body = `
    <p style="margin-bottom:12px">pick your baking buddy ♡</p>
    <div class="mascot-picker">
      <button type="button" class="mascot-card" data-m="f">
        <div class="m-svg">${MASCOTS.f.svg}</div>
        <div class="m-name">${MASCOTS.f.name.toUpperCase()}</div>
        <div class="m-tag">${MASCOTS.f.tag}</div>
      </button>
      <button type="button" class="mascot-card lav" data-m="m">
        <div class="m-svg">${MASCOTS.m.svg}</div>
        <div class="m-name">${MASCOTS.m.name.toUpperCase()}</div>
        <div class="m-tag">${MASCOTS.m.tag}</div>
      </button>
    </div>
    <p style="margin-top:10px; opacity:.75; font-size:16px">you can swap any time in the ★ MENU</p>
  `;
  openModal({
    emoji: '♡',
    title: 'PICK A BUDDY',
    bodyHTML: body,
    buttons: [],
  });
  document.querySelectorAll('.mascot-card').forEach(card => {
    card.addEventListener('click', () => {
      isPickingMascot = false;
      setMascot(card.dataset.m);
      closeModal();
      if (!storage.get('mochi_seenIntro', null)) {
        storage.set('mochi_seenIntro', '1');
        setTimeout(showIntro, 280);
      }
    });
  });
}
function setMascot(m) {
  if (!MASCOTS[m]) return;
  mascot = m;
  storage.set('mochi_mascot', m);
  updateBuddyRow();
}
function updateBuddyRow() {
  if (!mascot || !MASCOTS[mascot]) {
    buddyMini.innerHTML = '<span style="font-size:22px">♡</span>';
    buddyName.textContent = 'no buddy yet';
    return;
  }
  const m = MASCOTS[mascot];
  buddyMini.innerHTML = miniMascotSVG(m);
  buddyName.textContent = m.name + ' — ' + m.tag;
}

/* ── High score celebration ── */
const celebEl      = document.getElementById('celebration');
const celebMascot  = document.getElementById('celebMascot');
const celebSub     = document.getElementById('celebSub');
function showCelebration() {
  const m = MASCOTS[mascot] || MASCOTS.f;
  celebMascot.innerHTML = m.svg;
  celebSub.textContent = m.catchphrase;
  // Clear any stale confetti
  celebEl.querySelectorAll('.confetti').forEach(n => n.remove());
  // Make fresh confetti
  const chars = ['♡','✦','★','✿','✧','⭒'];
  const colors = ['#ff6fa8','#c9a9f0','#7ed3ab','#ffc14a','#ffafd5','#8ad5e8'];
  for (let i = 0; i < 36; i++) {
    const c = document.createElement('span');
    c.className = 'confetti';
    c.textContent = chars[Math.floor(Math.random() * chars.length)];
    c.style.left = (Math.random() * 100) + 'vw';
    c.style.color = colors[Math.floor(Math.random() * colors.length)];
    c.style.setProperty('--dx', (Math.random() * 60 - 30) + 'vw');
    c.style.setProperty('--rot', (Math.random() * 1080 - 540) + 'deg');
    c.style.animationDuration = (2 + Math.random() * 2.2) + 's';
    c.style.animationDelay = (Math.random() * 0.5) + 's';
    c.style.fontSize = (14 + Math.random() * 12) + 'px';
    celebEl.appendChild(c);
  }
  celebEl.classList.add('on');
  const dismiss = () => {
    celebEl.classList.remove('on');
    setTimeout(() => {
      celebEl.querySelectorAll('.confetti').forEach(n => n.remove());
    }, 300);
    celebEl.removeEventListener('click', dismiss);
  };
  celebEl.addEventListener('click', dismiss);
  setTimeout(dismiss, 5000);
}

/* ── Buttons & modal ── */
newBtn.addEventListener('click', () => init());
undoBtn.addEventListener('click', undo);
howBtn.addEventListener('click', showIntro);

/* ── Sound toggle ── */
const bgm = document.getElementById('bgm');
const soundBtn = document.getElementById('soundBtn');
let soundOn = storage.get('mochi_sound', 'off') === 'on';
let soundUnlocked = false;
let bgmReady = false;
let bgmErrorMsg = '';

bgm.volume = 0.45;
bgm.preload = 'auto';

function reflectSoundUI() {
  soundBtn.dataset.on = soundOn ? 'true' : 'false';
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
  soundBtn.setAttribute('aria-label', soundOn ? 'Sound on' : 'Sound off');
}
reflectSoundUI();

/* Convert the slow data: URL to a fast blob: URL.
   Data URLs require the browser to re-decode the base64 every read; blob URLs
   are stored as raw binary and play instantly. This is the single biggest fix
   for "tap speaker, nothing happens" on mobile. */
(async function convertToBlob() {
  try {
    const dataUrl = bgm.getAttribute('src');
    if (!dataUrl || !dataUrl.startsWith('data:')) return;
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    bgm.src = blobUrl;
    bgm.load();
    console.log('[bgm] converted to blob URL,', blob.size, 'bytes');
  } catch (e) {
    bgmErrorMsg = 'blob convert failed: ' + e.message;
    console.warn('[bgm]', bgmErrorMsg);
  }
})();

bgm.addEventListener('canplaythrough', () => {
  bgmReady = true;
  console.log('[bgm] ready to play');
});
bgm.addEventListener('error', () => {
  bgmErrorMsg = 'audio error code ' + (bgm.error && bgm.error.code);
  console.warn('[bgm]', bgmErrorMsg, bgm.error);
});
bgm.addEventListener('stalled', () => console.warn('[bgm] stalled'));
bgm.addEventListener('suspend',  () => console.log('[bgm] suspended'));
bgm.addEventListener('playing',  () => console.log('[bgm] playing'));

function flashSoundError(msg) {
  console.warn('[bgm] play failed:', msg);
  soundBtn.classList.remove('err');
  void soundBtn.offsetWidth;
  soundBtn.classList.add('err');
  setTimeout(() => soundBtn.classList.remove('err'), 1200);
}

function startBgm() {
  try { bgm.muted = false; } catch (e) {}
  const p = bgm.play();
  if (p && typeof p.then === 'function') {
    p.then(() => { soundUnlocked = true; })
     .catch((err) => {
       flashSoundError(err && err.name ? err.name + ': ' + err.message : String(err));
     });
  }
  return p;
}

soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  storage.set('mochi_sound', soundOn ? 'on' : 'off');
  reflectSoundUI();
  if (soundOn) {
    startBgm();
  } else {
    bgm.pause();
  }
});

/* Long-press the speaker (700ms) shows a tiny diagnostic so you can see
   what the audio system is actually doing if something's wrong. */
let pressTimer = null;
soundBtn.addEventListener('pointerdown', () => {
  pressTimer = setTimeout(() => {
    pressTimer = null;
    const info = [
      'state: ' + (soundOn ? 'on' : 'off'),
      'paused: ' + bgm.paused,
      'ready: ' + bgmReady,
      'duration: ' + (isFinite(bgm.duration) ? bgm.duration.toFixed(1) + 's' : '?'),
      'volume: ' + bgm.volume,
      'muted: ' + bgm.muted,
      'src type: ' + (bgm.src.startsWith('blob:') ? 'blob' : bgm.src.startsWith('data:') ? 'data' : 'other'),
      bgmErrorMsg ? 'last err: ' + bgmErrorMsg : 'no errors',
    ].join('\n');
    openModal({
      emoji: '🎧',
      title: 'AUDIO INFO',
      bodyHTML: '<pre style="text-align:left;font-family:VT323,monospace;font-size:16px;line-height:1.4;background:#fff5e8;border:2px solid var(--berry);border-radius:8px;padding:8px;white-space:pre-wrap;word-break:break-word">' + info + '</pre>',
      buttons: [{ label: 'OK ♡', primary: true }],
    });
  }, 700);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev =>
  soundBtn.addEventListener(ev, () => { clearTimeout(pressTimer); pressTimer = null; })
);

// If sound was previously enabled, resume on first user interaction after reload
function tryResumeOnInteraction() {
  if (soundOn && bgm.paused && !soundUnlocked) startBgm();
}
['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
  window.addEventListener(ev, tryResumeOnInteraction, { passive: true })
);

// Pause music while tab is hidden, resume when visible (if sound is on)
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (!bgm.paused) bgm.pause();
  } else if (soundOn && soundUnlocked) {
    bgm.play().catch(() => {});
  }
});
legendBtn.addEventListener('click', () => {
  legendBox.hidden = !legendBox.hidden;
  if (!legendBox.hidden) legendBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
});
changeMascotBtn.addEventListener('click', showMascotPicker);

function openModal({ emoji, title, bodyHTML, buttons }) {
  modalEmoji.textContent = emoji;
  modalTitle.textContent = title;
  modalBody.innerHTML = bodyHTML || '';
  modalActions.innerHTML = '';
  for (const b of buttons) {
    const btn = document.createElement('button');
    btn.className = 'btn ' + (b.primary ? 'primary' : 'ghost');
    btn.textContent = b.label;
    btn.addEventListener('click', () => { closeModal(); b.onClick?.(); });
    modalActions.appendChild(btn);
  }
  overlay.classList.add('on');
}
function closeModal() { overlay.classList.remove('on'); }

function showIntro() {
  openModal({
    emoji: '🍡',
    title: 'WELCOME!',
    bodyHTML: `
      <ul class="hint-list">
        <li>swipe to slide all the sweets</li>
        <li>match two to merge into the next dessert</li>
        <li>reach the ⭐ star cake to win</li>
        <li>arrow keys or WASD also work</li>
      </ul>
    `,
    buttons: [{ label: "LET'S BAKE ♡", primary: true }],
  });
}
function showWin() {
  openModal({
    emoji: '⭐',
    title: 'STAR CAKE!',
    bodyHTML: `<p>you made the legendary dessert ♡</p><p>keep merging for a higher score?</p>`,
    buttons: [
      { label: 'KEEP GOING', primary: true, onClick: () => { continued = true; } },
      { label: 'NEW GAME', onClick: () => init() },
    ],
  });
}
function showGameOver() {
  openModal({
    emoji: '🥲',
    title: 'CAFÉ CLOSED',
    bodyHTML: `<p>no more moves, sweet friend</p><p>your score: <b>${score}</b></p>`,
    buttons: [{ label: 'TRY AGAIN ♡', primary: true, onClick: () => init() }],
  });
}

/* Close modal on backdrop tap */
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) {
    if (isPickingMascot && !mascot) {
      // Default to Strawberry if they dismissed the first-boot picker
      setMascot('f');
      isPickingMascot = false;
      if (!storage.get('mochi_seenIntro', null)) {
        storage.set('mochi_seenIntro', '1');
        setTimeout(showIntro, 280);
      }
    } else {
      isPickingMascot = false;
    }
    closeModal();
  }
});

/* Keyboard shortcut: Z or Ctrl/Cmd+Z for undo */
window.addEventListener('keydown', (e) => {
  if (overlay.classList.contains('on')) return;
  if (e.key === 'z' || e.key === 'Z') {
    e.preventDefault();
    undo();
  }
});

/* ── Go! ── */
mascot = storage.get('mochi_mascot', null);
init(true);

/* Offline support */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
